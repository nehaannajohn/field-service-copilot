[project]
name = "field-service-copilot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "openai>=1.0",
    "python-dotenv>=1.0",
    "python-docx>=1.1",
    "tiktoken>=0.7",
    "numpy>=1.26",
]

[project.scripts]
copilot = "cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["common", "offline_pipeline", "online_query", "evaluation"]
py-modules = ["cli"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "--import-mode=importlib"
